<!doctype html>
<!--
  App Store product page header (21:9, 3840x1646, no alpha).
  Render:  doc/appstore/ios/src/render-header.sh [en|de]
  Strings: STRINGS below — add/adjust a language there, the layout stays the same.
-->
<html>
<head>
<meta charset="utf-8">
<title>App Store Header</title>
<style>
  @font-face { font-family: "Newsreader"; src: url("../../../../flutter/assets/fonts/Newsreader.ttf"); font-weight: 200 800; }
  @font-face { font-family: "Newsreader"; src: url("../../../../flutter/assets/fonts/Newsreader-Italic.ttf"); font-style: italic; font-weight: 200 800; }

  :root {
    --ink: #f6f2e9;
    --marker: #d9952f;
    --chip-bg: rgba(255,255,255,.10);
    --chip-border: rgba(255,255,255,.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 3840px; height: 1646px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1400px 900px at 50% 38%, rgba(120,150,255,.28), transparent 70%),
      radial-gradient(1200px 1000px at 92% 110%, rgba(74,144,217,.45), transparent 70%),
      radial-gradient(1100px 900px at 6% -10%, rgba(60,40,160,.55), transparent 70%),
      linear-gradient(115deg, #26277a 0%, #2f3f9a 45%, #3a63b0 100%);
  }

  /* Soft paper-light dots for texture */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.06) 2px, transparent 2.5px);
    background-size: 56px 56px;
    mask-image: radial-gradient(1500px 800px at 50% 40%, #000, transparent 80%);
  }

  /* ---------- Center block (kept inside the central safe area) ---------- */
  .center {
    position: absolute; left: 50%; top: 200px; transform: translateX(-50%);
    width: 2200px; text-align: center;
  }
  .brand { display: inline-flex; align-items: center; gap: 44px; }
  .brand img { height: 190px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.35)); }
  .brand h1 {
    font-family: "Newsreader", serif; font-weight: 700; font-size: 230px;
    letter-spacing: -4px; line-height: 1;
  }
  .tagline {
    margin-top: 70px;
    font-family: "Newsreader", serif; font-weight: 500; font-size: 118px;
    line-height: 1.18; letter-spacing: -1px;
  }
  .hl { position: relative; white-space: nowrap; z-index: 0; }
  .hl::before {
    content: ""; position: absolute; z-index: -1;
    left: -14px; right: -14px; bottom: 6px; height: 46px;
    background: var(--marker); border-radius: 8px 22px 10px 26px;
    transform: rotate(-1deg); opacity: .95;
  }
  .chips { margin-top: 84px; display: flex; justify-content: center; gap: 30px; }
  .chip {
    display: inline-flex; align-items: center; gap: 22px;
    padding: 28px 48px; border-radius: 999px; white-space: nowrap;
    background: var(--chip-bg); border: 3px solid var(--chip-border);
    font-size: 54px; font-weight: 600; letter-spacing: -.3px;
    backdrop-filter: blur(6px);
  }
  .chip svg { width: 58px; height: 58px; flex: none; }

  /* ---------- Phones (decorative, may be cropped on narrow layouts) ---------- */
  .phone {
    position: absolute; width: 720px; padding: 26px;
    background: #14151c; border-radius: 120px;
    box-shadow:
      0 0 0 4px #3a3d4a inset,
      0 60px 120px rgba(5,8,40,.55),
      0 20px 40px rgba(5,8,40,.35);
  }
  .screen {
    position: relative; overflow: hidden; border-radius: 96px;
    width: 668px; padding: 80px 0 36px;   /* keeps the rounded corners off the app UI */
    background: #f7f8fc;
  }
  .crop { overflow: hidden; height: calc(668px * 2680 / 1440); }   /* status + nav bar cropped */
  .screen img { display: block; width: 100%; transform: translateY(-3.75%); }
  .phone.left  { left: 110px;  top: 360px; transform: rotate(-9deg); }
  .phone.right { right: 110px; top: 280px; transform: rotate(7deg); }

  /* Calm band at the bottom: the App Store overlays icon/name/Get there */
  body::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
    background: linear-gradient(to bottom, transparent, rgba(20,22,70,.55));
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="phone left"><div class="screen"><div class="crop"><img id="shotLeft" alt=""></div></div></div>
  <div class="phone right"><div class="screen"><div class="crop"><img id="shotRight" alt=""></div></div></div>

  <div class="center">
    <div class="brand">
      <img src="../../../icon2-no-bg.png" alt="">
      <h1 id="name"></h1>
    </div>
    <p class="tagline" id="tagline"></p>
    <div class="chips">
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffc96b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
        <span id="f1"></span>
      </span>
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="#ffc96b"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
        <span id="f2"></span>
      </span>
      <span class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffc96b" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M8 14.5s1.5 2 4 2 4-2 4-2"/><circle cx="9" cy="9.5" r=".8" fill="#ffc96b"/><circle cx="15" cy="9.5" r=".8" fill="#ffc96b"/></svg>
        <span id="f3"></span>
      </span>
    </div>
  </div>

<script>
  const STRINGS = {
    en: {
      name: "My AI-Diary",
      tagline: 'Speak freely.<br>Get a <span class="hl">finished diary entry</span>.',
      f1: "One-tap recording", f2: "Smart structuring", f3: "Automatic mood tagging",
      shotLeft: "../../screens/Screenshot_20261013_001510.png",
      shotRight: "../../screens/Screenshot_20261013_001738.png",
    },
    // de: { name: "Mein KI-Tagebuch", tagline: "…", f1: "…", f2: "…", f3: "…", shotLeft: "…", shotRight: "…" },
  };
  const lang = new URLSearchParams(location.search).get("lang") || "en";
  const s = STRINGS[lang] || STRINGS.en;
  for (const id of ["name", "tagline", "f1", "f2", "f3"]) document.getElementById(id).innerHTML = s[id];
  document.getElementById("shotLeft").src = s.shotLeft;
  document.getElementById("shotRight").src = s.shotRight;
</script>
</body>
</html>
